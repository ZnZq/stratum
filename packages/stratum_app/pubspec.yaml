name: stratum_app
description: STRATUM — мобільний UI-шар над stratum_core (iOS та Android).
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  stratum_core:
    path: ../stratum_core
  # Saves go to the OS's per-app directory, which only the platform can name.
  path_provider: ^2.1.5
  # Bespoke resource icons; the Tabler font stays for everything generic.
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

  fonts:
    - family: ChakraPetch
      fonts:
        - asset: assets/fonts/ChakraPetch-Medium.ttf
          weight: 500
        - asset: assets/fonts/ChakraPetch-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ChakraPetch-Bold.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
    - family: TablerIcons
      fonts:
        - asset: assets/fonts/TablerIcons.ttf
