<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FF8FBB" stop-opacity=".9"/>
      <stop offset=".65" stop-color="#E4629B" stop-opacity=".3"/>
      <stop offset="1" stop-color="#E4629B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="qshard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD4E6"/>
      <stop offset="1" stop-color="#C2497E"/>
    </linearGradient>
  </defs>
  <!-- Scaled about the centre so the halo and the orbit sit inside the
