  <circle cx="16" cy="16" r="15.6" fill="url(#halo)"/>
  <path d="M16 2.6 22.6 12.7 20.4 27.9l-8.8.2-2.4-15.3Z" fill="url(#qshard)"/>
  <path d="M16 2.6 22.6 12.7l-6.4 2Z" fill="#FFE9F2"/>
  <path d="m16.2 14.7 6.4-2-2.2 15.2-4.4.1Z" fill="#A23368" opacity=".8"/>
  <circle cx="15.6" cy="8.2" r="1.3" fill="#FFFFFF" opacity=".95"/>
  <ellipse cx="16" cy="16.6" rx="14.6" ry="5.4" fill="none" stroke="#FFB9D4" stroke-width="1.3" stroke-opacity=".6" transform="rotate(-24 16 16.6)"/>
  <circle cx="28" cy="10.2" r="1.4" fill="#FFCBDF"/>
