<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="crFace" x1="8" y1="4" x2="24" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E2F5B4"/>
      <stop offset="0.45" stop-color="#9FD86E"/>
      <stop offset="1" stop-color="#4F7D2E"/>
    </linearGradient>
    <linearGradient id="crBack" x1="10" y1="8" x2="26" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7FB554"/>
      <stop offset="1" stop-color="#39591F"/>
    </linearGradient>
  </defs>

  <!-- the coin behind: the stack is what says "money" at 11 px -->
  <circle cx="20.2" cy="18.6" r="10.2" fill="url(#crBack)"/>
  <circle cx="20.2" cy="18.6" r="10.2" fill="none" stroke="#2C4517" stroke-width="1"/>

  <!-- the coin in front -->
  <circle cx="13.4" cy="13.4" r="11" fill="url(#crFace)"/>
  <circle cx="13.4" cy="13.4" r="11" fill="none" stroke="#3C6122" stroke-width="1.1"/>

  <!-- hex punch, the mint's mark -->
  <polygon points="13.4,7.6 18.3,10.5 18.3,16.3 13.4,19.2 8.5,16.3 8.5,10.5"
           fill="none" stroke="#33531D" stroke-width="1.7" stroke-linejoin="round"/>
  <circle cx="13.4" cy="13.4" r="1.7" fill="#EAF7C8"/>

  <!-- glint -->
  <path d="M6.4 8.6 A10 10 0 0 1 12.2 3.9" fill="none" stroke="#F2FBD9"
        stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
</svg>
