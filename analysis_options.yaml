# Спільні правила аналізу для всіх пакетів монорепи.
# Пакети підключають цей файл через `include` і додають власний набір лінтів
# (package:lints для ядра, package:flutter_lints для застосунку).
#
# Строгий режим увімкнено навмисно: ядро — це математика балансу, де неявне
# приведення типів або втрачений generic коштують мовчазно неправильних чисел.
analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
